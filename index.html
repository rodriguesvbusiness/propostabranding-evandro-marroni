<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proposta Evandro Marroni</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap">
<style>
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one long dark "sala", sections separated by hairlines, copper reserved for titles, choices and the CTA. */
:root{
  color-scheme: dark;
  --bg:#121110; --bg-2:#191715; --panel:#1E1B19; --line:rgba(226,124,64,.24); --hair:rgba(237,230,223,.09);
  --fg:#EDE6DF; --muted:#A1978E; --dim:#6E665F;
  --copper:#E07A3A; --copper-hi:#F6A062; --copper-lo:#9A4220;
  --grad:linear-gradient(100deg,#F7A462 0%,#E07A3A 42%,#A44A22 100%);
  --ok:#86B08A; --cline:rgba(224,122,58,.55); --cream:#E7E0A9;
  --f-display:"Playfair Display", "Iowan Old Style", Georgia, serif;
  --f-body:"Manrope", "Helvetica Neue", Arial, sans-serif;
  --wrap:1120px; --r:18px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:84px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1200px 600px at 85% -10%,rgba(224,122,58,.10),transparent 60%),
    linear-gradient(135deg,transparent 0 62%,rgba(255,255,255,.025) 62% 62.15%,transparent 62.15%),
    linear-gradient(225deg,transparent 0 78%,rgba(255,255,255,.02) 78% 78.12%,transparent 78.12%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--copper-hi);outline-offset:3px;border-radius:6px}

.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.serif{font-family:var(--f-display);font-style:italic;font-weight:400}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(18,17,16,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.bar .wrap{display:flex;align-items:center;gap:20px;height:64px}
.mark{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.mark .sym{height:30px;width:auto}
.mark .wm{height:15px;width:auto}
.foot-mark{display:flex;align-items:center;gap:10px}
.foot-mark img{height:12px;width:auto;opacity:.85}
.final{position:relative}
.final .seal{position:absolute;right:0;top:50%;transform:translateY(-50%);height:min(260px,40vw);width:auto;opacity:.16;pointer-events:none}
@media (max-width:700px){.final .seal{display:none}}
.nav{display:flex;gap:4px;margin:0 auto;overflow:hidden}
.nav a{font-size:12.5px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:99px;white-space:nowrap;transition:color .2s,background .2s}
.nav a:hover{color:var(--fg)}
.nav a.on{color:var(--fg);background:rgba(224,122,58,.14)}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;text-decoration:none;font-weight:600;border-radius:99px;transition:transform .15s,filter .2s,background .2s}
.btn-sm{white-space:nowrap;flex:none;padding:9px 16px;font-size:13px;background:var(--grad);color:#1A0E07;margin-left:auto}
.btn-sm:hover{filter:brightness(1.08)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--grad);width:0}
@media (max-width:1180px){.nav{display:none}}

/* demo banner */
.demo{font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--hair);background:var(--bg-2)}
.demo .wrap{padding-block:9px}
.demo b{color:var(--copper-hi);font-weight:600}

/* sections */
section{padding-block:clamp(72px,10vw,128px);border-top:1px solid var(--hair)}
.sec-head{display:grid;grid-template-columns:160px 1fr;gap:24px;margin-bottom:clamp(36px,5vw,56px);align-items:baseline}
.sec-num{font-size:12px;letter-spacing:.18em;color:var(--copper);font-weight:600;text-transform:uppercase}
.sec-title{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(34px,5vw,56px);line-height:1.08;margin:0;text-wrap:balance}
.indent{margin-left:184px}
@media (max-width:760px){.sec-head{grid-template-columns:1fr;gap:10px}.indent{margin-left:0}}

/* hero */
.hero{padding-block:clamp(56px,9vw,112px) clamp(56px,8vw,96px);border-top:0}
.hero h1{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(40px,6.6vw,84px);line-height:1.04;margin:18px 0 28px;max-width:16ch;text-wrap:balance}
.hero p.lead{font-size:clamp(17px,1.6vw,19px);color:var(--muted);max-width:60ch;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:28px 48px;margin-top:48px;padding-top:28px;border-top:1px solid var(--hair)}
.facts div{display:flex;flex-direction:column;gap:4px}
.facts dt{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
.facts dd{margin:0;font-size:15px;font-weight:500}
.facts .valid dd{color:var(--copper-hi)}

/* contexto */
.ctx{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(32px,6vw,80px)}
.ctx p{margin:0 0 18px;color:#D8D0C8;max-width:62ch}
.heard{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.heard li{padding:18px 0 18px 30px;border-bottom:1px solid var(--hair);position:relative;font-family:var(--f-display);font-style:italic;font-size:19px;line-height:1.4;color:var(--fg)}
.heard li::before{content:"“";position:absolute;left:0;top:10px;font-size:36px;color:var(--copper);font-family:var(--f-display)}
.heard-label{margin-bottom:6px}
@media (max-width:860px){.ctx{grid-template-columns:1fr}}

/* diagnóstico */
.ab{display:grid;grid-template-columns:1fr 64px 1fr;align-items:stretch}
.ab-col{padding:32px;border:1px solid var(--hair);border-radius:var(--r);background:var(--bg-2);min-width:0}
.ab-col.b{border-color:var(--line);background:linear-gradient(180deg,rgba(224,122,58,.08),rgba(224,122,58,.02))}
.ab-col h3{margin:0 0 18px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.ab-col.b h3{color:var(--copper-hi)}
.ab-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.ab-col li{padding-left:22px;position:relative}
.ab-col.a li{color:var(--muted)}
.ab-col li::before{content:"";position:absolute;left:0;top:.7em;width:10px;height:1px;background:var(--dim)}
.ab-col.b li::before{background:var(--copper)}
.ab-arrow{display:grid;place-items:center;color:var(--copper)}
.ab-arrow svg{width:28px;height:28px}
.tension{margin-top:40px;font-family:var(--f-display);font-style:italic;font-size:clamp(22px,2.6vw,30px);line-height:1.35;max-width:34ch;text-wrap:balance}
@media (max-width:760px){.ab{grid-template-columns:1fr}.ab-arrow{height:48px}.ab-arrow svg{transform:rotate(90deg)}.ab-col{padding:24px}}

/* caminho */
.thesis{font-family:var(--f-display);font-style:italic;font-size:clamp(34px,5.2vw,64px);line-height:1.08;margin:0 0 28px;max-width:20ch;text-wrap:balance}
.thesis-x{color:#D8D0C8;max-width:62ch;font-size:17px;margin:0}
.method{margin-top:64px;display:grid;grid-template-columns:280px 1fr;gap:clamp(28px,5vw,64px);padding-top:40px;border-top:1px solid var(--hair)}
.method h3{margin:6px 0 10px;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:30px}
.method p{color:var(--muted);margin:0;font-size:15px}
.lenses{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:var(--r);overflow:hidden}
.lens{background:var(--bg);padding:24px}
.lens .k{display:block;font-family:var(--f-display);font-style:italic;font-size:26px;line-height:1;margin-bottom:10px}
.words{display:flex;flex-wrap:wrap;gap:6px 22px;margin:28px 0 0;padding:0;list-style:none}
.words li{font-family:var(--f-display);font-style:italic;font-size:clamp(24px,2.6vw,32px)}
.lens b{display:block;font-weight:600;margin-bottom:6px}
.lens span{color:var(--muted);font-size:14.5px}
@media (max-width:860px){.method{grid-template-columns:1fr}}
@media (max-width:520px){.lenses{grid-template-columns:1fr}}

/* roadmap */
.tabs{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--hair);border-radius:99px;margin-bottom:28px;background:var(--bg-2)}
.tab{border:0;background:transparent;padding:10px 22px;border-radius:99px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--grad);color:#1A0E07}
.phase-meta{display:flex;flex-wrap:wrap;gap:8px 24px;margin-bottom:24px;color:var(--muted);font-size:14px}
.phase-meta b{color:var(--fg);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:st}
.step{text-align:left;border:1px solid var(--hair);background:var(--bg-2);border-radius:var(--r);padding:22px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,background .2s;min-width:0}
.step:hover{border-color:var(--line)}
.step[aria-expanded="true"]{border-color:var(--copper);background:linear-gradient(180deg,rgba(224,122,58,.10),var(--bg-2))}
.step .n{font-family:var(--f-display);font-style:italic;font-size:30px;line-height:1}
.step h4{margin:0;font-size:17px;font-weight:600}
.step p{margin:0;color:var(--muted);font-size:14px}
.step ul{list-style:none;margin:4px 0 0;padding:12px 0 0;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:6px;font-size:14px}
.step ul li::before{content:"→ ";color:var(--copper)}
.step .more{font-size:12px;color:var(--copper-hi);margin-top:auto;font-weight:600}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* escopo */
.scope{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sc{background:var(--bg-2);border:1px solid var(--hair);border-radius:14px;padding:24px 24px 26px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sc .tag{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--dim)}
.sc .tag.growth{color:var(--copper)}
.sc h4{margin:0;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:22px;line-height:1.2}
.sc h4 small{font-family:var(--f-body);font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
.sc ul{list-style:none;margin:0;padding:0;color:var(--muted);font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.scope-actions{display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;margin-top:28px}
.btn-ghost{padding:13px 22px;border:1px solid var(--line);background:rgba(224,122,58,.06);color:var(--fg);font-size:14px}
.btn-ghost:hover{background:rgba(224,122,58,.14)}
.btn-ghost .pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--copper);color:#1A0E07;font-weight:700}
.excl{font-size:13.5px;color:var(--dim)}
@media (max-width:900px){.scope{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.scope{grid-template-columns:1fr}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:90;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:22px 26px;border-bottom:1px solid var(--hair)}
.dr-head h3{margin:0;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:26px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--hair);background:transparent;cursor:pointer;font-size:20px;line-height:1}
.dr-body{overflow-y:auto;padding:8px 26px 40px}
.acc{border-bottom:1px solid var(--hair)}
.acc button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:none;border:0;padding:18px 0;cursor:pointer;text-align:left}
.acc button span:first-child{font-weight:600}
.acc button em{font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-left:8px;font-weight:700}
.acc button em.growth{color:var(--copper)}
.acc .chev{transition:transform .2s;color:var(--copper)}
.acc button[aria-expanded="true"] .chev{transform:rotate(45deg)}
.acc ul{margin:0 0 18px;padding-left:18px;color:#D3CBC3;font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.acc .obs{font-size:12.5px;color:var(--dim);margin:-6px 0 18px;padding-left:18px}
.dr-excl{margin-top:28px;padding:18px;border-radius:12px;background:var(--bg);border:1px solid var(--hair)}
.dr-excl h4{margin:0 0 10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.dr-excl ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}

/* transformação */
.dream{font-family:var(--f-display);font-style:italic;font-size:clamp(30px,4.4vw,54px);line-height:1.12;max-width:22ch;margin:0 0 56px;text-wrap:balance}
.pairs{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.pair{display:grid;grid-template-columns:1fr 40px 1fr;gap:16px;align-items:center;padding:22px 0;border-bottom:1px solid var(--hair)}
.pair .de{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(224,122,58,.5)}
.pair .ar{color:var(--copper);text-align:center}
.pair .para{font-size:18px;font-weight:500}
.milestones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:64px;position:relative}
.milestones::before{content:"";position:absolute;left:0;right:0;top:7px;height:1px;background:linear-gradient(90deg,var(--copper),rgba(224,122,58,.1))}
.ms{position:relative;padding-top:32px}
.ms::before{content:"";position:absolute;top:0;left:0;width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--copper)}
.ms:last-child::before{background:var(--copper)}
.ms b{display:block;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:26px;margin-bottom:6px}
.ms p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:700px){.pair{grid-template-columns:1fr;gap:4px}.pair .ar{text-align:left}.milestones{grid-template-columns:1fr}.milestones::before{left:7px;right:auto;top:0;bottom:0;width:1px;height:auto}.ms{padding:0 0 0 36px}}

/* cronograma: tabela de semanas/meses no estilo dos slides RODRI */
.crono{display:grid;border-top:1px solid var(--cline);border-bottom:1px solid var(--cline)}
.crono .hc{padding:18px 16px;font-size:15px;color:var(--fg);border-left:1px solid var(--cline);border-bottom:1px solid var(--cline)}
.crono .hc.first{border-left:0}
.crono .lane{padding:22px 16px 22px 0;font-size:clamp(17px,1.6vw,20px);display:flex;align-items:center;border-top:1px solid var(--cline)}
.crono .lane.first{border-top:0}
.crono .cell{border-left:1px solid var(--cline);border-top:1px solid var(--cline)}
.crono .cell.first{border-top:0}
.cblk{padding:8px 8px 20px;align-self:start;min-width:0;z-index:1}
.cpill{display:block;background:var(--grad);color:#fff;border-radius:12px;padding:9px 14px;font-size:clamp(14px,1.35vw,18px);font-weight:500;line-height:1.25;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 18px rgba(224,122,58,.18);text-shadow:0 1px 1px rgba(80,30,10,.35)}
.cblk ul{margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.55}
.crono-list{display:none;flex-direction:column;border-top:1px solid var(--cline)}
.crono-list .ci{padding:18px 0;border-bottom:1px solid var(--cline);display:flex;flex-direction:column;gap:10px}
.crono-list .cmeta{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.crono-list .cpill{align-self:flex-start}
.crono-list ul{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px}
@media (max-width:760px){.crono{display:none}.crono-list{display:flex}}
.gnote{margin-top:22px;font-size:16px;color:#D8D0C8;max-width:60ch}
.gnote em{font-family:var(--f-display);font-style:italic;color:var(--copper-hi);font-size:19px;margin-right:4px}
/* método vision */
.vision{margin-top:64px;padding-top:44px;border-top:1px solid var(--hair);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:center}
.vision h3{margin:8px 0 0;font-style:normal;font-family:var(--f-display);font-weight:500;font-size:clamp(30px,3.4vw,44px);letter-spacing:.01em;line-height:1.05}
.vision h3 sup{font-size:.4em;vertical-align:super;margin-left:4px}
.vision .vsub{display:block;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(30px,3.4vw,44px);line-height:1.1;margin-bottom:22px}
.vision p{color:#D8D0C8;margin:0 0 14px;max-width:52ch}
.vision svg{width:100%;height:auto;max-width:520px;justify-self:center;display:block}
@media (max-width:860px){.vision{grid-template-columns:1fr}}


/* prova */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 28px}
.case{padding:20px 0;border-top:1px solid var(--hair)}
.case b{display:block;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:21px;margin-bottom:4px}
.case span{color:var(--muted);font-size:14px}

/* portfólio: carrossel contínuo, pausa no hover/foco */
@media (min-width:761px){.marquee{margin-left:-184px}.mq-hint{margin-left:0}}
.marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;gap:20px;width:max-content;animation:slide var(--dur,60s) linear infinite}
.marquee:hover .track,.marquee:focus-within .track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(calc(-50% - 10px))}}
.slide{flex:none;width:min(600px,82vw);margin:0}
.slide .ph{border-radius:16px;overflow:hidden;background:#E4E4E6;aspect-ratio:1400/569}
.slide img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.slide:hover img{transform:scale(1.03)}
.slide figcaption{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:14px 4px 0}
.slide figcaption b{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:22px}
.slide figcaption span{color:var(--muted);font-size:14px}
.mq-hint{margin-top:16px;font-size:12.5px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){.marquee{overflow-x:auto}.track{animation:none}.track [aria-hidden="true"]{display:none}}
/* investimento */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.plans.single{grid-template-columns:minmax(0,560px)}
.plans.single .radio{display:none}
.plan{position:relative;text-align:left;border:1px solid var(--hair);background:var(--bg-2);border-radius:22px;padding:28px 26px;cursor:pointer;display:flex;flex-direction:column;gap:14px;transition:border-color .2s,transform .2s,background .2s;min-width:0}
.plan:hover{border-color:var(--line)}
.plan[aria-checked="true"]{border-color:var(--copper);background:linear-gradient(180deg,rgba(224,122,58,.12),var(--bg-2) 70%);box-shadow:0 0 0 1px var(--copper) inset}
.plan .badge{position:absolute;top:-11px;left:24px;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 12px;border-radius:99px;background:var(--grad);color:#1A0E07}
.plan .radio{position:absolute;top:26px;right:24px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--dim)}
.plan[aria-checked="true"] .radio{border-color:var(--copper);background:radial-gradient(circle,var(--copper) 0 5px,transparent 6px)}
.plan h4{margin:0;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:34px;line-height:1}
.plan .sub{color:var(--muted);font-size:14px;margin-top:-6px}
.plan .price{font-size:30px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.plan .price small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.plan .price .old{font-size:15px;font-weight:500;color:#E5533D;text-decoration-color:#E5533D;text-decoration-thickness:1.5px;margin-right:10px;vertical-align:middle}
.plan .anchor{font-size:13px;color:var(--dim)}
.plan .anchor s{color:var(--muted)}
.plan ul{list-style:none;margin:0;padding:14px 0 0;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.plan li{padding-left:20px;position:relative}
.plan li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border-radius:2px;background:var(--copper);transform:rotate(45deg) scale(.7)}
.pay{margin-top:40px;display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}
.pay h3{margin:0 0 14px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:16px minmax(0,1fr);align-items:start;gap:12px;padding:16px 18px;border:1px solid var(--hair);border-radius:14px;background:var(--bg-2);cursor:pointer;text-align:left;width:100%}
.opt:hover{border-color:var(--line)}
.opt[aria-checked="true"]{border-color:var(--copper);background:rgba(224,122,58,.08)}
.opt .oc{display:flex;flex-direction:column;gap:4px;min-width:0}
.opt .ol{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-weight:600}
.opt .dot{margin-top:3px}
.opt .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--dim);flex:none}
.opt[aria-checked="true"] .dot{border-color:var(--copper);background:radial-gradient(circle,var(--copper) 0 4px,transparent 5px)}
.ptag{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--copper-hi);background:rgba(224,122,58,.08)}
.ig{color:var(--copper-hi);text-decoration:none;font-weight:600}
.ig:hover{text-decoration:underline}
.opt .ov b{color:var(--fg);font-weight:600}
.opt .ov{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;}
.summary{border:1px solid var(--line);border-radius:22px;padding:26px;background:linear-gradient(160deg,rgba(224,122,58,.14),rgba(224,122,58,.02) 60%);position:sticky;top:88px}
.summary .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14.5px;border-bottom:1px solid var(--hair)}
.summary .row span:first-child{color:var(--muted)}
.summary .row span:last-child{text-align:right;font-weight:600}
.summary .big{font-size:clamp(22px,2.3vw,28px);line-height:1.2;text-wrap:balance;font-weight:700;font-variant-numeric:tabular-nums;margin:16px 0 2px}
.summary .bigsub{color:var(--muted);font-size:13.5px;margin-bottom:22px}
.btn-cta{width:100%;justify-content:center;padding:17px 22px;font-size:16px;background:var(--grad);color:#1A0E07}
.btn-cta:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn-cta svg{width:20px;height:20px}
.copyrow{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:14px;font-size:12.5px;color:var(--dim)}
.linkbtn{background:none;border:0;color:var(--copper-hi);cursor:pointer;font-size:12.5px;font-weight:600;padding:4px 0}
.validity{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:13px;color:var(--muted)}
.validity i{width:8px;height:8px;border-radius:50%;background:var(--copper);box-shadow:0 0 0 4px rgba(224,122,58,.18);flex:none}
@media (max-width:900px){.pay{grid-template-columns:1fr}.summary{position:static}}

/* cta / footer */
.final{text-align:left}
.final h2{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(44px,7vw,92px);line-height:1;margin:0 0 20px}
.final p{color:var(--muted);max-width:56ch;margin:0 0 32px;font-size:17px}
.final .btn-cta{width:auto;padding:18px 30px}
footer{border-top:1px solid var(--hair);padding-block:28px;font-size:12.5px;color:var(--dim)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}

  <div class="dr-body" id="dr-body"></div>
</aside>

<script>
(function(){
let D; try { D = JSON.parse(document.getElementById('proposta-data').textContent); } catch(e) { document.getElementById('app').innerHTML='<section><div class="wrap"><p>Os dados desta proposta estão com erro de formatação (JSON inválido).</p></div></section>'; return; }
const SEAL = document.querySelector('.mark .sym').src;
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits: v%1?2:0, maximumFractionDigits:2});
const mes = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fdate = iso => { const [y,m,d]=iso.split('-').map(Number); return `${String(d).padStart(2,'0')} ${mes[m-1]} ${y}`; };
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
const wa = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1c-.2.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3Z"/></svg>';

const VISION_SVG = `<svg viewBox="950 190 610 590" role="img" aria-label="Método Vision: Extração, Direção e Materialização em torno de Essência de marca, Identidade de valor e Posicionamento">
  <polygon points="1256,215 975,700 1537,700" fill="none" stroke="var(--copper)" stroke-width="1.6" opacity=".85"/>
  <g fill="none" stroke="var(--cream)" stroke-width="1.4" opacity=".85"><circle cx="1256" cy="455" r="120"/><circle cx="1184" cy="580" r="120"/><circle cx="1330" cy="580" r="120"/></g>
  <path d="M1188,532 Q1256,468 1324,532 Q1256,596 1188,532 Z" fill="var(--cream)"/>
  <circle cx="1256" cy="532" r="27" fill="#6A655E"/><circle cx="1256" cy="532" r="15" fill="none" stroke="var(--cream)" stroke-width="5"/><path d="M1238,520 l10,2 -6,8" fill="none" stroke="var(--cream)" stroke-width="4"/>
  <g font-family="Manrope, Arial, sans-serif" font-weight="700" font-size="15" fill="#B9B1A8" text-anchor="middle" letter-spacing=".5">
    <text x="1256" y="407">ESSÊNCIA</text><text x="1256" y="427">DE MARCA</text>
    <text x="1138" y="606">IDENTIDADE</text><text x="1138" y="626">DE VALOR</text>
    <text x="1374" y="606">POSICIO-</text><text x="1374" y="626">NAMENTO</text>
  </g>
  <g font-family="Manrope, Arial, sans-serif" font-size="27" fill="#C9C1B8" text-anchor="middle" letter-spacing="1">
    <text transform="translate(1078,445) rotate(-60)">EXTRAÇÃO</text>
    <text transform="translate(1428,432) rotate(60)">DIREÇÃO</text>
    <text x="1256" y="745">MATERIALIZAÇÃO</text>
  </g>
</svg>`;
const M = D.meta||{};
document.title = `Proposta · ${M.cliente||'RODRI'}`;
if (M.exemplo) $('#demo').hidden = false;
$('#foot-l').textContent = `Proposta ${M.codigo||''} · válida até ${M.validade?fdate(M.validade):''}`;

const sections = []; // {id,label,html}
let n = 0;
const head = (label,title)=>{ n++; return `<div class="sec-head"><div class="sec-num">${String(n).padStart(2,'0')} · ${esc(label)}</div><h2 class="sec-title">${esc(title)}</h2></div>`; };

/* HERO */
let html = '';
if (D.hero){
  const daysLeft = M.validade ? Math.ceil((new Date(M.validade+'T23:59:59-03:00') - new Date())/864e5) : null;
  html += `<section class="hero" id="topo"><div class="wrap">
    <div class="eyebrow">${esc(D.hero.eyebrow||'Proposta comercial')}</div>
    <h1 class="g">${esc(D.hero.titulo)}</h1>
    ${D.hero.subtitulo?`<p class="lead">${esc(D.hero.subtitulo)}</p>`:''}
    <dl class="facts">
      <div><dt>Para</dt><dd>${esc(M.cliente)}</dd></div>
      <div><dt>Projeto</dt><dd>${esc(M.projeto)}</dd></div>
      <div><dt>Data</dt><dd>${M.data?fdate(M.data):''}</dd></div>
      ${M.validade?`<div class="valid"><dt>Válida até</dt><dd>${fdate(M.validade)}${daysLeft!=null&&daysLeft>=0?` · ${daysLeft===0?'último dia':daysLeft+(daysLeft===1?' dia':' dias')}`:''}</dd></div>`:''}
    </dl></div></section>`;
}

/* CONTEXTO */
if (D.contexto){ const c=D.contexto;
  sections.push({id:'contexto',label:'Contexto',html:`${head('Contexto',c.titulo||'Contexto')}
  <div class="ctx indent"><div>${(c.leitura||[]).map(p=>`<p>${esc(p)}</p>`).join('')}${c.palavras?`<ul class="words">${c.palavras.map(w=>`<li class="g">${esc(w)}</li>`).join('')}</ul>`:''}</div>
  ${c.ouvi?`<div><div class="eyebrow heard-label">Pontos que você trouxe</div><ul class="heard">${c.ouvi.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div>`:''}</div>`});
}

/* DIAGNÓSTICO */
if (D.diagnostico){ const d=D.diagnostico;
  const col=(o,k)=>`<div class="ab-col ${k}"><h3>${esc(o.rotulo)}</h3><ul>${o.itens.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`;
  sections.push({id:'diagnostico',label:'Diagnóstico',html:`${head('Diagnóstico',d.titulo||'Diagnóstico')}
  <div class="indent"><div class="ab">${col(d.ponto_a,'a')}<div class="ab-arrow" aria-hidden="true">${arrow}</div>${col(d.ponto_b,'b')}</div>
  ${d.tensao?`<p class="tension">${esc(d.tensao)}</p>`:''}</div>`});
}

/* CAMINHO */
if (D.caminho){ const c=D.caminho, m=c.metodo;
  sections.push({id:'caminho',label:'O caminho',html:`${head('O caminho','A tese')}
  <div class="indent"><p class="thesis g">${esc(c.tese)}</p><p class="thesis-x">${esc(c.explicacao)}</p>
  ${m&&m.diagrama==='vision'?`<div class="vision"><div><div class="eyebrow">Nossa metodologia</div><h3 class="g">${esc(m.nome)}<sup>®</sup></h3><span class="vsub g">${esc(m.sub||'Vision to value')}</span>${[].concat(m.descricao||[]).map(p=>`<p>${esc(p)}</p>`).join('')}</div>${VISION_SVG}</div>`:''}
  ${m&&m.diagrama!=='vision'?`<div class="method"><div><div class="eyebrow">Método</div><h3 class="g">${esc(m.nome)}</h3><p>${esc(m.descricao)}</p></div>
  <div class="lenses" style="--n:${(m.lentes||[]).length===3?3:2}">${(m.lentes||[]).map(l=>`<div class="lens">${l.num?`<span class="k g">${esc(l.num)}</span>`:''}<b>${esc(l.nome)}</b><span>${esc(l.texto)}</span></div>`).join('')}</div></div>`:''}</div>`});
}

/* ROADMAP */
if (D.roadmap){ const r=D.roadmap, multi=r.fases.length>1;
  sections.push({id:'formato',label:'Formato',html:`${head('Formato da entrega',r.titulo||'Formato da entrega')}
  <div class="indent">${multi?`<div class="tabs" role="tablist">${r.fases.map((f,i)=>`<button class="tab" role="tab" aria-selected="${i===0}" data-fase="${i}">${esc(f.nome)}</button>`).join('')}</div>`:''}
  <div id="phase"></div></div>`});
}

/* ESCOPO */
if (D.escopo){ const e=D.escopo;
  sections.push({id:'escopo',label:'Entregáveis',html:`${head('Entregáveis',e.titulo||'Entregáveis')}
  <div class="indent"><div class="scope">${e.grupos.map(g=>`<div class="sc"><span class="tag ${g.fase||''}">${esc(g.fase||'')}</span><h4>${esc(g.nome)}${g.nota?`<small>${esc(g.nota)}</small>`:''}</h4><ul>${g.resumo.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}</div>
  <div class="scope-actions"><button class="btn btn-ghost" id="open-scope">Clique para ver o escopo detalhado <span class="pill">${e.grupos.reduce((a,g)=>a+(g.detalhe||[]).length,0)} itens</span></button>
  ${e.nao_inclui?`<span class="excl">Inclui também a lista do que fica fora do escopo.</span>`:''}</div></div>`});
}

/* TRANSFORMAÇÃO */
if (D.transformacao){ const t=D.transformacao;
  sections.push({id:'transformacao',label:'Transformação',html:`${head('Entrega de valor',t.titulo||'O que muda')}
  <div class="indent"><p class="dream g">${esc(t.frase)}</p>
  <div class="pairs">${(t.pares||[]).map(p=>`<div class="pair"><span class="de">${esc(p.de)}</span><span class="ar" aria-hidden="true">→</span><span class="para">${esc(p.para)}</span></div>`).join('')}</div>
  ${t.marcos?`<div class="milestones">${t.marcos.map(m=>`<div class="ms"><b class="g">${esc(m.quando)}</b><p>${esc(m.texto)}</p></div>`).join('')}</div>`:''}</div>`});
}

/* CRONOGRAMA */
if (D.cronograma){ const c=D.cronograma, cols=c.colunas.length;
  let g=`<div class="crono" style="grid-template-columns:minmax(110px,.9fr) repeat(${cols},minmax(0,1fr))"><div class="hc first"></div>${c.colunas.map(x=>`<div class="hc">${esc(x)}</div>`).join('')}`;
  let list='';
  c.trilhas.forEach((t,ti)=>{ const row=ti+2, f=ti===0?' first':'';
    g+=`<div class="lane${f}" style="grid-row:${row};grid-column:1">${esc(t.nome)}</div>`;
    for(let k=0;k<cols;k++) g+=`<div class="cell${f}" style="grid-row:${row};grid-column:${k+2}"></div>`;
    t.blocos.forEach(b=>{ const items=b.itens?`<ul>${b.itens.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
      g+=`<div class="cblk" style="grid-row:${row};grid-column:${b.de+1} / ${b.ate+2}"><span class="cpill">${esc(b.rotulo)}</span>${items}</div>`;
      const per=b.de===b.ate?c.colunas[b.de-1]:`${c.colunas[b.de-1]} a ${c.colunas[b.ate-1]}`;
      list+=`<div class="ci"><span class="cmeta">${esc(t.nome)} · ${esc(per)}</span><span class="cpill">${esc(b.rotulo)}</span>${items}</div>`; });
  });
  g+='</div>';
  const nota=c.nota?`<p class="gnote">${c.nota_rotulo?`<em>${esc(c.nota_rotulo)}</em>`:''}${esc(c.nota)}</p>`:'';
  sections.push({id:'cronograma',label:'Cronograma',html:`${head('Cronograma',c.titulo||'Cronograma')}<div class="indent">${g}<div class="crono-list">${list}</div>${nota}</div>`});
}

/* PROVA */
if (D.prova){ const p=D.prova;
  let LIB={}; try{ LIB=JSON.parse(document.getElementById('portfolio-imgs')?.textContent||'{}'); }catch(_){}
  const withImg=p.cases.filter(c=>c.img&&LIB[c.img]);
  let body;
  if (withImg.length){
    const fig=(c,dup)=>`<figure class="slide"${dup?' aria-hidden="true"':''}><div class="ph"><img src="${LIB[c.img]}" alt="${dup?'':esc('Identidade criada para '+c.nome)}" loading="lazy"></div><figcaption><b class="g">${esc(c.nome)}</b><span>${esc(c.descricao)}</span></figcaption></figure>`;
    body=`<div class="marquee" tabindex="0" aria-label="Portfólio de marcas"><div class="track" style="--dur:${withImg.length*9}s">${withImg.map(c=>fig(c,false)).join('')}${withImg.map(c=>fig(c,true)).join('')}</div></div><p class="mq-hint">Passe o mouse para pausar.</p>`;
    const rest=p.cases.filter(c=>!(c.img&&LIB[c.img]));
    if(rest.length) body+=`<div class="cases" style="margin-top:32px">${rest.map(c=>`<div class="case"><b>${esc(c.nome)}</b><span>${esc(c.descricao)}</span></div>`).join('')}</div>`;
  } else {
    body=`<div class="cases">${p.cases.map(c=>`<div class="case"><b>${esc(c.nome)}</b><span>${esc(c.descricao)}</span></div>`).join('')}</div>`;
  }
  sections.push({id:'prova',label:'Portfólio',html:`${head('Quem assina',p.titulo||'Portfólio')}<div class="indent">${body}</div>`});
}

/* INVESTIMENTO */
const I = D.investimento;
if (I){
  sections.push({id:'investimento',label:'Investimento',html:`${head('Investimento',I.titulo||'Investimento')}
  <div class="indent"><div class="plans${I.caminhos.length===1?' single':''}" role="radiogroup" aria-label="Caminhos">${I.caminhos.map(c=>`
    <button class="plan" role="radio" aria-checked="false" data-id="${esc(c.id)}">
      ${c.recomendado?`<span class="badge">${esc(c.selo||'Recomendado')}</span>`:''}<span class="radio" aria-hidden="true"></span>
      <h4 class="g">${esc(c.nome)}</h4><div class="sub">${esc(c.subtitulo)}</div>
      <div class="price"><small>${c.a_partir_de?'A partir de':'Investimento'}</small>${c.ancora&&!c.ancora.rotulo?`<s class="old">${brl(c.ancora.valor)}</s>`:''}${brl(c.preco)}</div>
      ${c.ancora&&c.ancora.rotulo?`<div class="anchor"><s>${brl(c.ancora.valor)}</s> ${esc(c.ancora.rotulo)}</div>`:''}
      <ul>${c.inclui.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
    </button>`).join('')}</div>
  <div class="pay"><div><h3>Escolha sua forma de pagamento</h3><div class="opts" id="opts" role="radiogroup" aria-label="Forma de pagamento"></div></div>
  <div class="summary" id="summary" aria-live="polite"></div></div></div>`});
}

/* CTA */
if (D.cta){
  sections.push({id:'cta',label:'Fechar',nav:false,html:`<div class="final"><img class="seal" src="${SEAL}" alt=""><h2 class="g">${esc(D.cta.titulo)}</h2><p>${esc(D.cta.texto)}</p><a class="btn btn-cta" id="cta2" target="_blank" rel="noopener">${wa}<span>Seguir pelo WhatsApp</span></a><p style="margin:22px 0 0;font-size:14px">Conheça mais do estúdio em <a class="ig" href="https://instagram.com/rodribrand" target="_blank" rel="noopener">@rodribrand</a></p></div>`});
}

html += sections.map(s=>`<section id="${s.id}"><div class="wrap">${s.html}</div></section>`).join('');
$('#app').innerHTML = html;
$('#nav').innerHTML = sections.filter(s=>s.nav!==false).map(s=>`<a href="#${s.id}" data-id="${s.id}">${esc(s.label)}</a>`).join('');

/* roadmap behaviour */
if (D.roadmap){
  const renderPhase = i => { const f=D.roadmap.fases[i];
    $('#phase').innerHTML = `<div class="phase-meta"><span><b>${esc(f.nome)}</b> · ${esc(f.funcao)}</span><span>Prazo: <b>${esc(f.prazo)}</b></span></div>
    <div class="steps">${f.etapas.map((s,k)=>`<button class="step" aria-expanded="false"><span class="n g">${k+1}</span><h4>${esc(s.nome)}</h4><p>${esc(s.objetivo)}</p><ul hidden>${s.saidas.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><span class="more">Ver saídas +</span></button>`).join('')}</div>`;
    $('#phase').querySelectorAll('.step').forEach(b=>b.addEventListener('click',()=>{ const o=b.getAttribute('aria-expanded')==='true'; b.setAttribute('aria-expanded',!o); b.querySelector('ul').hidden=o; b.querySelector('.more').textContent=o?'Ver saídas +':'Fechar −'; }));
  };
  renderPhase(0);
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{ document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t)); renderPhase(+t.dataset.fase); }));
}

/* drawer */
if (D.escopo){ const e=D.escopo;
  $('#dr-body').innerHTML = e.grupos.map((g,i)=>`<div class="acc"><button aria-expanded="${i===0}"><span>${esc(g.nome)}<em class="${g.fase||''}">${esc(g.fase||'')}</em></span><span class="chev">+</span></button>
    <div ${i===0?'':'hidden'}><ul>${(g.detalhe||g.resumo).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${g.observacao?`<p class="obs">${esc(g.observacao)}</p>`:''}</div></div>`).join('')
    + (e.nao_inclui?`<div class="dr-excl"><h4>Fora do escopo</h4><ul>${e.nao_inclui.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'');
  $('#dr-body').querySelectorAll('.acc > button').forEach(b=>b.addEventListener('click',()=>{ const o=b.getAttribute('aria-expanded')==='true'; b.setAttribute('aria-expanded',!o); b.nextElementSibling.hidden=o; }));
  const dr=$('#drawer'), sc=$('#scrim'); let last=null;
  const open=()=>{ last=document.activeElement; dr.classList.add('open'); sc.classList.add('open'); dr.setAttribute('aria-hidden','false'); $('#dr-close').focus(); document.body.style.overflow='hidden'; };
  const close=()=>{ dr.classList.remove('open'); sc.classList.remove('open'); dr.setAttribute('aria-hidden','true'); document.body.style.overflow=''; last&&last.focus(); };
  $('#open-scope').addEventListener('click',open); $('#dr-close').addEventListener('click',close); sc.addEventListener('click',close);
  document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&dr.classList.contains('open')) close(); });
}

/* investimento behaviour */
if (I){
  const P = Object.fromEntries(I.pagamentos.map(p=>[p.id,p]));
  let sel = (I.caminhos.find(c=>c.recomendado)||I.caminhos[0]).id, pay=null;
  const calc = (c,p) => {
    if (p.linha) return {total:p.total??c.preco, linha:p.linha, extra:p.extra||''};
    if (p.desconto) { const v=c.preco*(1-p.desconto); return {total:v, linha:`${brl(v)} à vista`, extra:`${Math.round(p.desconto*100)}% de desconto`}; }
    const n = p.parcelas==='meses' ? (c.meses||1) : p.parcelas;
    const v = c.preco/n;
    return {total:c.preco, linha:`${n}x de ${brl(v)}`, extra:p.obs||''};
  };
  const render = () => {
    const c = I.caminhos.find(x=>x.id===sel);
    document.querySelectorAll('.plan').forEach(b=>b.setAttribute('aria-checked',b.dataset.id===sel));
    const ids = c.pagamentos || Object.keys(P);
    if (!ids.includes(pay)) pay = ids[0];
    $('#opts').innerHTML = ids.map(id=>{ const p=P[id], r=calc(c,p); return `<button class="opt" role="radio" aria-checked="${id===pay}" data-p="${id}"><span class="dot"></span><span class="oc"><span class="ol">${esc(p.rotulo)}${p.tag?`<span class="ptag">${esc(p.tag)}</span>`:''}</span><span class="ov"><b>${esc(r.linha)}</b>${r.extra?` · ${esc(r.extra)}`:''}</span></span></button>`; }).join('');
    $('#opts').querySelectorAll('.opt').forEach(o=>o.addEventListener('click',()=>{ pay=o.dataset.p; render(); }));
    const p=P[pay], r=calc(c,p);
    const msg = (D.cta?.mensagem||'Olá, Victor! Quero seguir com o {caminho}. Pagamento: {pagamento} — {condicao}.')
      .replace('{codigo}',M.codigo||'').replace('{caminho}',c.nome).replace('{subtitulo}',c.subtitulo).replace('{pagamento}',p.rotulo).replace('{condicao}',r.linha);
    const href = `https://wa.me/${M.whatsapp}?text=${encodeURIComponent(msg)}`;
    const daysLeft = M.validade ? Math.ceil((new Date(M.validade+'T23:59:59-03:00') - new Date())/864e5) : null;
    $('#summary').innerHTML = `<div class="eyebrow">Sua escolha</div>
      <div class="big">${esc(r.linha)}</div><div class="bigsub">${esc(c.nome)} · ${esc(c.subtitulo)}${r.extra?' · '+esc(r.extra):''}</div>
      <div class="row"><span>Caminho</span><span>${esc(c.nome)}</span></div>
      <div class="row"><span>Prazo</span><span>${esc(c.prazo)}</span></div>
      <div class="row"><span>Pagamento</span><span>${esc(p.rotulo)}</span></div>
      <div class="row"><span>Total</span><span>${brl(r.total)}</span></div>
      <div style="height:20px"></div>
      <a class="btn btn-cta" href="${href}" target="_blank" rel="noopener">${wa}<span>Quero seguir com esta opção</span></a>
      <div class="copyrow"><span>Abre o WhatsApp com a mensagem pronta.</span><button class="linkbtn" id="copy">Copiar mensagem</button></div>
      ${daysLeft!=null&&daysLeft>=0?`<div class="validity"><i></i>Condições válidas por mais ${daysLeft===0?'algumas horas':daysLeft+(daysLeft===1?' dia':' dias')}, até ${fdate(M.validade)}.</div>`:''}`;
    const c2=$('#cta2'); if(c2) c2.href=href;
    $('#copy').addEventListener('click',async e=>{ try{ await navigator.clipboard.writeText(msg); e.target.textContent='Copiada'; }catch(_){ e.target.textContent='Não foi possível copiar'; } });
  };
  document.querySelectorAll('.plan').forEach(b=>b.addEventListener('click',()=>{ sel=b.dataset.id; render(); }));
  render();
}

/* scroll spy + progress */
const links=[...document.querySelectorAll('#nav a')], prog=$('#progress');
const onScroll=()=>{ const h=document.documentElement; prog.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';
  let cur=null; for(const s of sections){ const el=document.getElementById(s.id); if(el && el.getBoundingClientRect().top<140) cur=s.id; }
  links.forEach(a=>a.classList.toggle('on',a.dataset.id===cur)); };
addEventListener('scroll',onScroll,{passive:true}); onScroll();
})();
</script>
</body>
</html>
